<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="푸른숲 계산기">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>푸른숲 계산기</title>
<meta name="theme-color" content="#1E6B3C">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
:root{
  --bg:#F4F7F3; --surface:#FFFFFF; --ink:#18241C; --muted:#586A5E; --line:#D9E2DA;
  --brand:#1E6B3C; --on-brand:#FFFFFF; --brand-soft:#E1EFE5;
  --pay:#2150B8; --pay-soft:#E2EAFA; --got:#1E6B3C; --got-soft:#DAEEDF; --late:#A25A00; --late-soft:#FAE8CC;
  --staff-bg:#EDEFF3; --staff-ink:#555D6C; --danger:#B3261E; --focus:#1E6B3C;
  --paper:#FFFFFF; --paper-ink:#111111; --paper-line:#222222; --paper-faint:#6B6B6B;
  --font:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --k1:#FBD9DB; --k2:#DDF1CB; --k3:#FFF1B8;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111915; --surface:#1A251F; --ink:#E7F0EA; --muted:#9DB0A4; --line:#2C3B32;
  --brand:#5CC184; --on-brand:#0B2415; --brand-soft:#1E3A2A;
  --pay:#93B3FF; --pay-soft:#1E2B4A; --got:#7FD3A0; --got-soft:#1C3A27; --late:#F0B45E; --late-soft:#42320F;
  --staff-bg:#232A31; --staff-ink:#A9B1BD; --danger:#FF8A80; --focus:#5CC184; --k1:#4A2A2D; --k2:#2A3F25; --k3:#4A4220; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#111915; --surface:#1A251F; --ink:#E7F0EA; --muted:#9DB0A4; --line:#2C3B32;
  --brand:#5CC184; --on-brand:#0B2415; --brand-soft:#1E3A2A;
  --pay:#93B3FF; --pay-soft:#1E2B4A; --got:#7FD3A0; --got-soft:#1C3A27; --late:#F0B45E; --late-soft:#42320F;
  --staff-bg:#232A31; --staff-ink:#A9B1BD; --danger:#FF8A80; --focus:#5CC184; --k1:#4A2A2D; --k2:#2A3F25; --k3:#4A4220; color-scheme:dark;}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:15px}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:1rem;line-height:1.5;margin:0;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
#app{position:relative;z-index:1;background:var(--bg);min-height:100vh;display:flex;flex-direction:column}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:.25rem 16px 0}
.tr{display:flex;align-items:center;justify-content:space-between;gap:.8rem}
.brand{display:flex;align-items:center;gap:.5rem}
.brand h1{font-size:1.2rem;font-weight:800;margin:0;letter-spacing:-.02em}
.brand svg{width:1.4rem;height:1.4rem;flex:none}
.up-btn{border:1.5px solid var(--line);background:var(--surface);border-radius:.6rem;padding:.25rem .6rem;font-size:.78rem;font-weight:700;color:var(--muted)}
.up-btn:hover{border-color:var(--brand);color:var(--brand)}
.hbtns{display:flex;gap:.35rem}
.up-btn[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin-top:.1rem}
nav button{border:0;border-bottom:3px solid transparent;background:none;padding:.35rem .1rem .3rem;font-weight:700;font-size:.84rem;color:var(--muted);white-space:nowrap;text-align:center}
nav button[aria-current="page"]{color:var(--brand);border-bottom-color:var(--brand);font-weight:800}

.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:.6rem;padding:.3rem .8rem;font-weight:700;min-height:2.4rem;font-size:.9rem}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.small{padding:.15rem .6rem;min-height:2rem;font-size:.82rem}
.btn[disabled]{opacity:.5;cursor:default}

.main{flex:1;display:grid;grid-template-columns:minmax(260px,330px) minmax(0,1fr);width:100%}
.main.wide{display:block;padding:.7rem 16px 3rem}
.list{border-right:1px solid var(--line);background:var(--surface);padding:.55rem 16px;overflow:auto;max-height:calc(100vh - var(--hh,6rem));position:sticky;top:var(--hh,6rem);align-self:start}
.detail{padding:.6rem 16px 4rem;min-width:0}
.search{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:.6rem;padding:.3rem .7rem;margin-bottom:.4rem;font-size:.9rem}
.li{display:block;width:100%;text-align:left;border:1.5px solid transparent;background:none;border-radius:.7rem;padding:.4rem .55rem;margin-bottom:.1rem}
.li:hover{background:var(--bg)}
.li[aria-current="true"]{background:var(--brand-soft);border-color:var(--brand)}
.li b{display:block;font-weight:700;font-size:.98rem;line-height:1.3;overflow-wrap:anywhere}
.li small{display:block;color:var(--muted);font-size:.72rem;line-height:1.35}
.hint{color:var(--muted);font-size:.8rem;margin:.2rem 0 .5rem}
.seg{display:flex;gap:.25rem;flex-wrap:wrap;margin-bottom:.4rem}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:2rem;padding:.12rem .6rem;font-size:.78rem;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand);font-weight:700}

.dh{display:flex;flex-wrap:wrap;align-items:center;gap:.3rem .6rem;margin-bottom:.25rem}
.dh .back{display:none}
.title-in{font-size:1.2rem;font-weight:800;border:0;border-bottom:2px dashed transparent;background:none;padding:.1rem 0;min-width:0;flex:1 1 0;letter-spacing:-.01em}
.title-in:hover,.title-in:focus{border-bottom-color:var(--line)}
.date-in{border:1.5px solid var(--line);background:var(--surface);border-radius:.5rem;padding:.1rem .4rem;font-size:.75rem}
.sum{display:flex;flex-wrap:wrap;gap:.3rem;margin:.2rem 0 .5rem;align-items:center}
.pill{display:inline-flex;gap:.3rem;align-items:baseline;border-radius:.5rem;background:var(--surface);border:1px solid var(--line);padding:.05rem .5rem;font-size:.75rem}
.pill b{font-variant-numeric:tabular-nums}
.pill.p{background:var(--pay-soft);border-color:transparent;color:var(--pay)}
.pill.g{background:var(--got-soft);border-color:transparent;color:var(--got)}
.pill.l{background:var(--late-soft);border-color:transparent;color:var(--late)}
.bar{display:flex;flex-wrap:wrap;gap:.35rem .6rem;align-items:center;margin-bottom:.5rem}
.bar .search{margin:0;flex:1 1 100%;width:auto}
.bar .seg{margin:0;flex-wrap:nowrap;overflow-x:auto;max-width:100%;padding-bottom:2px}
.bar .seg button{flex:none;white-space:nowrap}

.blk{background:var(--surface);border:1px solid var(--line);border-radius:.8rem;padding:.5rem .65rem;margin-bottom:.45rem}
.blk.staff{background:var(--staff-bg);color:var(--staff-ink);border-style:dashed}
.bh{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.2rem .5rem;margin-bottom:.15rem}
.bh h3{margin:0;font-size:1.02rem;font-weight:800;overflow-wrap:anywhere;flex:0 1 auto;line-height:1.3}
.bh h3 small{font-weight:500;color:var(--muted);font-size:.65rem;margin-left:.3rem}
.chips{display:flex;gap:.2rem;flex-wrap:nowrap;margin-left:auto}
.chip{display:inline-flex;align-items:center;gap:.2rem;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);border-radius:2rem;padding:.1rem .42rem;font-weight:700;min-height:2.2rem;font-size:.8rem}
.chip::before{content:"";width:.75rem;height:.75rem;border-radius:.2rem;border:1.8px solid currentColor;flex:none}
.chip[aria-pressed="true"]::before{background:currentColor;box-shadow:inset 0 0 0 2px var(--surface)}
.chip.pay[aria-pressed="true"]{background:var(--pay-soft);border-color:var(--pay);color:var(--pay)}
.chip.got[aria-pressed="true"]{background:var(--got-soft);border-color:var(--got);color:var(--got)}
.chip.late[aria-pressed="true"]{background:var(--late-soft);border-color:var(--late);color:var(--late)}
.th{border-left:2px solid var(--line);padding-left:.5rem;margin:.15rem 0}
.cm{display:grid;grid-template-columns:1.5rem minmax(0,1fr);gap:.3rem;padding:.05rem 0;font-size:.95rem;line-height:1.4}
.cm .no{color:var(--muted);font-size:.65rem;font-variant-numeric:tabular-nums;padding-top:.2rem;text-align:right}
.cm .tx{overflow-wrap:anywhere;white-space:pre-wrap}
.cm .tm{color:var(--muted);font-size:.65rem;margin-left:.3rem;white-space:nowrap}
.cm.reply{margin-left:1rem}
.cm.reply .no::before{content:"↳ "}
.cm.st{background:var(--staff-bg);border-radius:.4rem;color:var(--staff-ink);padding:.1rem .3rem}
.who{font-size:.62rem;font-weight:700;border-radius:.4rem;padding:.02rem .4rem;margin-right:.4rem;background:var(--staff-bg);color:var(--staff-ink);border:1px solid var(--line)}

.empty{max-width:34rem;margin:3rem auto;text-align:center;border:2px dashed var(--line);border-radius:1.2rem;padding:2rem 1.2rem;background:var(--surface)}
.empty h2{margin:.2rem 0 .5rem;font-size:1.25rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:.8rem;padding:.55rem .7rem .65rem;margin:0 auto .6rem;max-width:46rem}
.card h2{margin:0 0 .3rem;font-size:.9rem;color:var(--muted)}
.pr{display:grid;grid-template-columns:minmax(0,1fr) 4.6rem 4.4rem 1.8rem;gap:.3rem;margin-bottom:.3rem}
.pr input{border:1.5px solid var(--line);background:var(--bg);border-radius:.5rem;padding:.3rem .5rem;min-width:0;font-size:.9rem}
.opt{display:flex;flex-wrap:wrap;gap:.25rem .9rem;margin:.35rem 0}
.opt label{display:flex;align-items:center;gap:.3rem;font-size:.8rem}
.opt input{width:1rem;height:1rem;accent-color:var(--brand)}
.postsel{display:flex;flex-wrap:wrap;gap:.1rem .8rem}
label.opt{display:flex;align-items:center;gap:.3rem;font-size:.8rem}
.pvwrap{margin-top:.6rem;background:var(--staff-bg);border-radius:1rem;padding:1rem .5rem;overflow:hidden}

/* 계산기 */
.cwrap{max-width:46rem;margin:0 auto}
.cbar{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.5rem}
.cbar .btn.primary{flex:1 1 10rem}
.quick{display:flex;flex-wrap:wrap;gap:.3rem}
.qb{display:inline-flex;align-items:baseline;gap:.35rem;border:1.5px solid var(--line);background:var(--bg);border-radius:2rem;padding:.2rem .65rem}
.qb:hover{border-color:var(--brand);background:var(--brand-soft)}
.qb b{font-weight:700;font-size:.9rem}
.qb[data-cat="과일"],.pr[data-cat="과일"],.crow[data-cat="과일"],.cgh[data-cat="과일"]{background:var(--k1)}
.qb[data-cat="야채"],.pr[data-cat="야채"],.crow[data-cat="야채"],.cgh[data-cat="야채"]{background:var(--k2)}
.qb[data-cat="공구"],.pr[data-cat="공구"],.crow[data-cat="공구"],.cgh[data-cat="공구"]{background:var(--k3)}
.qb[data-cat]:hover{background:var(--brand-soft)}
.pr[data-cat],.crow[data-cat]{padding:.2rem .3rem;border-radius:.5rem}
.cgh[data-cat]{display:inline-block;padding:.05rem .6rem;border-radius:2rem;color:var(--ink)}
.qb small{color:var(--muted);font-size:.72rem}
.chead,.crow{display:grid;grid-template-columns:minmax(0,1fr) 4.6rem 3.8rem 4.2rem 1.4rem;gap:.25rem;align-items:center}
.chead{font-size:.68rem;color:var(--muted);padding:0 0 .1rem}
.chead span:nth-child(n+2){text-align:center}
.chead span:nth-child(4){text-align:right}
.crow{padding:.15rem 0;border-bottom:1px solid var(--line)}
.crow input{width:100%;min-width:0;border:1.5px solid var(--line);background:var(--bg);border-radius:.5rem;padding:.3rem .35rem;font-size:.92rem;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.crow input::-webkit-outer-spin-button,.crow input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.crow input[aria-label="수량"]{text-align:center}
.crow input[aria-label="단가(원)"]{text-align:right}
.qcell{display:flex;align-items:stretch;gap:.15rem;min-width:0}
.qcell input{flex:1}
.qa{display:flex;flex-direction:column;gap:2px;width:1.35rem;flex:none}
.qa button{flex:1;min-height:.95rem;border:1.5px solid var(--line);background:var(--surface);border-radius:.3rem;font-size:.6rem;line-height:1;padding:0;color:var(--ink)}
.qa button:active{background:var(--brand-soft);border-color:var(--brand)}
.amt{text-align:right;font-weight:800;font-size:.9rem;font-variant-numeric:tabular-nums}
.x{border:0;background:none;color:var(--muted);font-size:1rem;border-radius:.4rem;padding:0;height:2rem}
.cgh{font-size:.72rem;font-weight:800;color:var(--brand);margin:.45rem 0 .1rem}
.qg{margin-bottom:.35rem}
.ql{display:block;font-size:.72rem;font-weight:800;color:var(--brand);margin-bottom:.15rem}
.nm-in{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:.5rem;padding:.3rem .5rem;margin-bottom:.35rem;font-size:.92rem}
.pr select{border:1.5px solid var(--line);background:var(--bg);border-radius:.5rem;padding:.3rem .15rem;font-size:.85rem;min-width:0}
.rc{background:var(--surface);border:1.5px dashed var(--line);border-radius:.6rem;padding:.55rem .75rem;margin-bottom:.6rem;max-width:34rem}
.rc-h{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;border-bottom:1px dashed var(--line);padding-bottom:.3rem;margin-bottom:.25rem}
.rc-h b{font-size:1.05rem;overflow-wrap:anywhere}
.rc-h span{font-size:.72rem;color:var(--muted);white-space:nowrap}
.rc-g{font-size:.7rem;font-weight:800;color:var(--brand);margin:.3rem 0 .05rem}
.rc-l{display:grid;grid-template-columns:minmax(0,1fr) auto 4.8rem;gap:.4rem;padding:.08rem 0;font-size:.92rem;font-variant-numeric:tabular-nums}
.rc-l .m{color:var(--muted);font-size:.8rem;text-align:right}
.rc-l b{text-align:right}
.rc-t{display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed var(--line);margin-top:.4rem;padding-top:.3rem;font-weight:800}
.rc-t b{font-size:1.2rem;font-variant-numeric:tabular-nums}
.rc-a{display:flex;gap:.4rem;margin-top:.45rem}
.cgrid{display:grid;gap:.6rem;grid-template-columns:minmax(0,1fr)}
.ccol .card{max-width:none;margin:0 0 .6rem}
.ccol .cbar{margin-bottom:.4rem}
@media (min-width:1180px){
  .cgrid{grid-template-columns:minmax(0,1fr) minmax(0,22rem);align-items:start}
  .ccol{position:sticky;top:calc(var(--hh,6rem) + .6rem);max-height:calc(100vh - var(--hh,6rem) - 1.2rem);overflow:auto;padding-right:2px}
}
.ctotal .tt{display:flex;align-items:center;gap:.7rem}
.ctotal .sv{background:var(--on-brand);color:var(--brand);border:0;border-radius:.6rem;padding:.3rem .9rem;font-weight:800;font-size:.95rem;min-height:2.2rem}
.ctotal .sv[disabled]{opacity:.5}
.ctotal{position:sticky;bottom:calc(.4rem + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:space-between;gap:1rem;background:var(--brand);color:var(--on-brand);border-radius:.8rem;padding:.35rem .9rem;margin-top:.5rem;font-size:.9rem}
.ctotal b{font-size:1.35rem;font-weight:800;font-variant-numeric:tabular-nums}

.overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow:auto}
.modal{background:var(--surface);border-radius:1.2rem;padding:1.2rem;width:100%;max-width:40rem}
.modal h2{margin:0 0 .3rem}
.up{border:1px solid var(--line);border-radius:.9rem;padding:.7rem;margin:.6rem 0;display:grid;gap:.4rem}
.up input{border:1.5px solid var(--line);background:var(--bg);border-radius:.6rem;padding:.4rem .6rem;width:100%}
.up .meta{color:var(--muted);font-size:.8rem}
.up .err{color:var(--danger);font-size:.85rem}
.mact{display:flex;gap:.5rem;justify-content:flex-end;margin-top:.8rem;flex-wrap:wrap}
.drop{position:fixed;inset:0;z-index:60;background:var(--brand);color:var(--on-brand);display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:800;opacity:.94}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:.8rem;z-index:70;max-width:90vw;font-weight:500}


.main.wide{padding-bottom:calc(var(--dock,7rem) + 1.2rem)}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto 1.6rem;gap:.4rem;align-items:center;padding:.3rem .2rem;border-bottom:1px solid var(--line)}
.mrow .ex{display:block;color:var(--muted);font-size:.72rem;overflow-wrap:anywhere}
.mrow b{font-variant-numeric:tabular-nums;font-size:.95rem}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:.4rem max(12px,env(safe-area-inset-right,0px)) calc(.5rem + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));background:linear-gradient(to top,var(--bg) 78%,transparent)}
.dock-in{max-width:46rem;margin:0 auto;display:grid;gap:.4rem}
.dtot{display:flex;align-items:center;justify-content:space-between;gap:.8rem;background:var(--brand);color:var(--on-brand);border-radius:.9rem;padding:.4rem .5rem .4rem .9rem}
.dtot b{font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums}
.dtot .acts{display:flex;gap:.35rem}
.dtot button{border:0;border-radius:.6rem;padding:.3rem .8rem;font-weight:800;font-size:.92rem;min-height:2.4rem;background:var(--on-brand);color:var(--brand)}
.dtot button.ghost{background:transparent;color:var(--on-brand);border:1.5px solid color-mix(in srgb,var(--on-brand) 55%,transparent)}
.dtot button.warn{background:var(--danger);color:#fff}
.dtot button[disabled]{opacity:.45}
.pad{background:var(--surface);border:1px solid var(--line);border-radius:.9rem;padding:.5rem}
.pad-d{min-height:3.2rem;text-align:right;padding:.1rem .3rem .4rem;border-bottom:1px solid var(--line);margin-bottom:.45rem}
.pad-e{font-size:1.15rem;font-weight:700;overflow-wrap:anywhere;font-variant-numeric:tabular-nums;min-height:1.6rem}
.pad-r{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums;min-height:1.2rem}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:.35rem}
.keys button{border:1.5px solid var(--line);background:var(--bg);border-radius:.7rem;min-height:2.9rem;font-size:1.25rem;font-weight:700;color:var(--ink)}
.keys button:active{background:var(--brand-soft);border-color:var(--brand)}
.keys .op{background:var(--brand-soft);color:var(--brand)}
.keys .fn{color:var(--muted)}
.keys .go{background:var(--brand);border-color:var(--brand);color:var(--on-brand);font-size:1rem}

</style>
<div id="app">
  <header class="top">
    <div class="tr"><div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="15" cy="19" r="10" fill="var(--brand)"/><path d="M16 9c0-4 3-6 7-6 0 4-2 7-7 6z" fill="var(--brand)" opacity=".7"/><path d="M11 17c1-2 3-3 5-3" stroke="var(--on-brand)" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      <h1>푸른숲 계산기</h1></div></div>
  </header>
  <main id="main" class="main wide"></main>
  <div id="dock" class="dock"></div>
  <div id="toast" role="status" hidden></div>
</div>
<datalist id="pl"></datalist>

}
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
};
const CATS = ['과일', '야채', '공구'];
const catKeys = [...CATS, ''];
const won = n => Math.round(n).toLocaleString('ko-KR') + '원';
const nfmt = n => Math.round(n).toLocaleString('ko-KR');
const num = v => { const n = parseFloat(String(v == null ? '' : v).replace(/,/g, '')); return isFinite(n) ? n : 0; };
let toastTimer;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3800); }
const load = (k, d) => { try { const v = JSON.parse(store.get(k) || 'null'); return v == null ? d : v; } catch (e) { return d; } };
const normPrices = a => (Array.isArray(a) ? a : []).filter(x => x && typeof x === 'object').map(x => ({ n: String(x.n || ''), p: num(x.p), c: CATS.includes(x.c) ? x.c : '' }));

const S = {
  prices: normPrices(load('pc_prices', [])),
  rows: (() => { const v = load('calc', []); return Array.isArray(v) ? v.filter(r => r && typeof r === 'object').slice(0, 200) : []; })(),
  priceEdit: false, pad: false, expr: '', confirmClear: false
};
const savePrices = items => { S.prices = normPrices(items); if (!store.set('pc_prices', JSON.stringify(S.prices))) toast('이 기기에 저장하지 못했어요. 브라우저의 저장 허용을 확인하세요.'); };
const saveRows = () => store.set('calc', JSON.stringify(S.rows));
const priceOf = name => { const f = S.prices.find(x => x.n === String(name || '').trim()); return f ? f.p : 0; };
const sumRows = rows => rows.reduce((t, r) => t + num(r.q) * num(r.p), 0);

/* ---------- 수식 계산 (eval 없이) ---------- */
function evalExpr(s) {
  const t = s.match(/\d+(?:\.\d+)?|\.\d+|[+\-×÷]/g) || [];
  if (!t.length || t.join('') !== s.replace(/\s/g, '')) return null;
  let i = 0;
  const numTok = () => { const v = t[i]; if (v == null || /[+\-×÷]/.test(v)) return null; i++; return parseFloat(v); };
  const term = () => { let a = numTok(); if (a == null) return null; while (t[i] === '×' || t[i] === '÷') { const op = t[i++]; const b = numTok(); if (b == null) return null; if (op === '÷' && b === 0) return NaN; a = op === '×' ? a * b : a / b; } return a; };
  let a = term(); if (a == null || Number.isNaN(a)) return a;
  while (t[i] === '+' || t[i] === '-') { const op = t[i++]; const b = term(); if (b == null || Number.isNaN(b)) return b; a = op === '+' ? a + b : a - b; }
  return i === t.length ? a : null;
}
const normExpr = e => e.replace(/−/g, '-');
const liveResult = () => { const r = evalExpr(normExpr(S.expr)); return r == null ? '' : Number.isNaN(r) ? '0으로 나눌 수 없어요' : '= ' + (Math.round(r * 100) / 100).toLocaleString('ko-KR'); };

/* ---------- 화면 ---------- */
let pendingRender = false;
const typing = () => { const a = document.activeElement; return a && a !== document.body && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName) && $('#app').contains(a); };
function render(force) {
  if (!force && typing()) { pendingRender = true; return; }
  pendingRender = false;
  $('#pl').replaceChildren(...S.prices.map(x => h('option', { value: x.n })));
  $('#main').replaceChildren(view());
  $('#dock').replaceChildren(dock());
  setDock();
}
function setDock() { const d = $('#dock'); if (d) document.documentElement.style.setProperty('--dock', d.offsetHeight + 'px'); }
window.addEventListener('resize', setDock);
document.addEventListener('focusout', () => setTimeout(() => { if (pendingRender && !typing()) render(); }, 60));

function pricesPanel() {
  const items = S.prices.map(x => ({ ...x }));
  const commit = () => savePrices(items.filter(y => y.n));
  const rows = items.map((x, i) => h('div', { class: 'pr', 'data-cat': CATS.includes(x.c) ? x.c : null },
    h('input', { value: x.n, placeholder: '품목 이름', 'aria-label': '품목 이름', 'data-new': x.n ? null : '1', onchange: e => { x.n = e.target.value.trim(); commit(); } }),
    h('input', { type: 'number', min: '0', inputmode: 'numeric', value: x.p || '', placeholder: '단가(원)', 'aria-label': '단가(원)', onchange: e => { x.p = num(e.target.value); commit(); } }),
    h('select', { 'aria-label': '분류', onchange: e => { x.c = e.target.value; commit(); } },
      h('option', { value: '', text: '분류', selected: !CATS.includes(x.c) ? true : null }), ...CATS.map(c => h('option', { value: c, text: c, selected: x.c === c ? true : null }))),
    h('button', { class: 'btn small', type: 'button', 'aria-label': '삭제', text: '✕', onclick: () => { items.splice(i, 1); S.prices = items; commit(); render(true); } })));
  return h('div', { class: 'card' }, h('h2', { text: '가격표' }),
    h('p', { class: 'hint', text: '품목, 단가, 분류(과일·야채·공구)를 적어두면 아래에서 눌러서 담을 수 있어요. 바꾸면 바로 저장돼요.' }),
    ...rows,
    h('button', { class: 'btn', type: 'button', text: '+ 품목 추가', onclick: () => { items.push({ n: '', p: 0, c: '과일' }); S.prices = items; render(true); const e = $('.pr input[data-new]'); if (e) e.focus(); } }));
}
function view() {
  const wrap = h('div', { class: 'cwrap' });
  wrap.append(h('div', { class: 'cbar' }, h('button', { class: 'btn primary', type: 'button', text: S.priceEdit ? '가격표 닫기' : '가격표 만들기', onclick: () => { S.priceEdit = !S.priceEdit; render(true); } })));
  if (S.priceEdit) wrap.append(pricesPanel());
  const named = S.prices.filter(x => x.n);
  if (named.length) {
    const qgs = catKeys.map(k => ({ k, list: named.filter(x => (CATS.includes(x.c) ? x.c : '') === k) })).filter(g => g.list.length);
    wrap.append(h('div', { class: 'card' }, h('h2', { text: '눌러서 담기' }),
      ...qgs.map(g => h('div', { class: 'qg' }, qgs.length > 1 || g.k ? h('span', { class: 'ql', text: g.k || '기타' }) : null,
        h('div', { class: 'quick' }, ...g.list.map(x => h('button', { class: 'qb', type: 'button', 'data-cat': CATS.includes(x.c) ? x.c : null, onclick: () => {
          const f = S.rows.find(r => !r.m && r.i === x.n && num(r.p) === num(x.p));
          if (f) f.q = num(f.q) + 1; else S.rows.push({ i: x.n, q: 1, p: num(x.p), c: x.c || '' });
          saveRows(); render(true);
        } }, h('b', { text: x.n }), h('small', { text: x.p ? won(x.p) : '단가 없음' }))))))));
  }
  const card = h('div', { class: 'card' }, h('h2', { text: '계산' }));
  const items = S.rows.filter(r => !r.m), manual = S.rows.filter(r => r.m);
  if (!S.rows.length) card.append(h('p', { class: 'hint', text: named.length ? '위에서 품목을 눌러 담거나, 아래 "금액 추가"로 계산해서 넣으세요.' : '아래 "금액 추가"로 계산해서 넣거나, 가격표를 만들어 두고 눌러서 담으세요.' }));
  if (items.length) card.append(h('div', { class: 'chead' }, h('span', { text: '품목' }), h('span', { text: '수량' }), h('span', { text: '단가' }), h('span', { text: '금액(원)' }), h('span')));
  const rowEl = r => {
    const amt = h('output', { class: 'amt', text: nfmt(num(r.q) * num(r.p)) });
    const upd = () => { amt.textContent = nfmt(num(r.q) * num(r.p)); $('#tot').textContent = won(sumRows(S.rows)); saveRows(); };
    const qIn = h('input', { type: 'number', min: '0', step: 'any', inputmode: 'decimal', value: r.q === 0 ? '0' : (r.q == null ? '' : String(r.q)), 'aria-label': '수량', oninput: e => { r.q = e.target.value; upd(); } });
    const step = d => { r.q = Math.max(0, num(r.q) + d); qIn.value = String(r.q); upd(); };
    const pIn = h('input', { type: 'number', min: '0', step: 'any', inputmode: 'numeric', value: num(r.p) ? String(r.p) : '', placeholder: '단가', 'aria-label': '단가(원)', oninput: e => { r.p = e.target.value; upd(); } });
    const nIn = h('input', { list: 'pl', value: r.i || '', placeholder: '품목', 'aria-label': '품목', oninput: e => { r.i = e.target.value; saveRows(); },
      onchange: e => { r.i = e.target.value.trim(); if (!num(r.p)) { const pr = priceOf(r.i); if (pr) { r.p = pr; pIn.value = String(pr); } } upd(); } });
    return h('div', { class: 'crow', 'data-cat': CATS.includes(r.c) ? r.c : null }, nIn,
      h('div', { class: 'qcell' }, qIn, h('span', { class: 'qa' },
        h('button', { type: 'button', 'aria-label': '수량 하나 늘리기', text: '▲', onclick: () => step(1) }),
        h('button', { type: 'button', 'aria-label': '수량 하나 줄이기', text: '▼', onclick: () => step(-1) }))),
      pIn, amt,
      h('button', { class: 'x', type: 'button', 'aria-label': '이 줄 지우기', text: '✕', onclick: () => { const i = S.rows.indexOf(r); if (i >= 0) S.rows.splice(i, 1); saveRows(); render(true); } }));
  };
  for (const k of catKeys) {
    const rs = items.filter(r => (CATS.includes(r.c) ? r.c : '') === k);
    if (rs.length) card.append(h('div', { class: 'cgh', 'data-cat': k || null, text: k || '기타' }), ...rs.map(rowEl));
  }
  if (manual.length) {
    card.append(h('div', { class: 'cgh', text: '직접 입력' }));
    for (const r of manual) card.append(h('div', { class: 'mrow' },
      h('span', {}, h('b', { text: '금액' }), r.e ? h('span', { class: 'ex', text: r.e }) : null),
      h('b', { text: nfmt(num(r.p)) }),
      h('button', { class: 'x', type: 'button', 'aria-label': '이 줄 지우기', text: '✕', onclick: () => { S.rows.splice(S.rows.indexOf(r), 1); saveRows(); render(true); } })));
  }
  wrap.append(card);
  return wrap;
}

/* ---------- 아래 고정 막대: 키패드 + 합계 ---------- */
function press(k) {
  const ops = '+-×÷'.split('');
  const e = S.expr;
  const last = e.slice(-1);
  if (k === 'C') S.expr = '';
  else if (k === '⌫') S.expr = e.slice(0, -1);
  else if (ops.includes(k) || k === '−') {
    const op = k === '−' ? '−' : k;
    if (!e) { if (op === '−') S.expr = '−'; }
    else if ('+−×÷'.includes(last)) S.expr = e.slice(0, -1) + op;
    else S.expr = e + op;
  } else if (k === '.') {
    const cur = e.split(/[+−×÷]/).pop(); if (!cur.includes('.')) S.expr = e + (cur ? '.' : '0.');
  } else if (k === '=') {
    const r = evalExpr(normExpr(e)); if (r == null) { toast('식을 끝까지 입력하세요.'); return; } if (Number.isNaN(r)) { toast('0으로 나눌 수 없어요.'); return; }
    S.expr = String(Math.round(r * 100) / 100);
  } else S.expr = e + k;
  render(true);
}
function addAmount() {
  const e = S.expr; const r = evalExpr(normExpr(e));
  if (r == null) { toast('식을 끝까지 입력하세요.'); return; }
  if (Number.isNaN(r)) { toast('0으로 나눌 수 없어요.'); return; }
  const v = Math.round(r * 100) / 100;
  if (!v) { toast('0원은 추가할 수 없어요.'); return; }
  S.rows.push({ i: '', q: 1, p: v, c: '', m: 1, e: /[+−×÷]/.test(e.slice(1)) ? e + ' = ' + v.toLocaleString('ko-KR') : '' });
  S.expr = ''; S.pad = false; saveRows(); render(true); window.scrollTo(0, document.body.scrollHeight);
}
function dock() {
  const inner = h('div', { class: 'dock-in' });
  if (S.pad) {
    const key = (k, cls) => h('button', { type: 'button', class: cls || null, text: k, 'aria-label': k === '⌫' ? '한 글자 지우기' : k === 'C' ? '전부 지우기' : null, onclick: () => press(k) });
    inner.append(h('div', { class: 'pad' },
      h('div', { class: 'pad-d' }, h('div', { class: 'pad-e', text: S.expr || '0' }), h('div', { class: 'pad-r', text: liveResult() })),
      h('div', { class: 'keys' },
        key('C', 'fn'), key('⌫', 'fn'), key('÷', 'op'), key('×', 'op'),
        key('7'), key('8'), key('9'), key('−', 'op'),
        key('4'), key('5'), key('6'), key('+', 'op'),
        key('1'), key('2'), key('3'), key('=', 'op'),
        key('0'), key('00'), key('.'), h('button', { type: 'button', class: 'go', text: '추가', onclick: addAmount }))));
  }
  const clear = S.confirmClear
    ? h('button', { type: 'button', class: 'warn', text: '정말 비우기', onclick: () => { S.rows.length = 0; S.confirmClear = false; saveRows(); render(true); } })
    : h('button', { type: 'button', class: 'ghost', text: '새 계산', disabled: S.rows.length ? null : true, onclick: () => { S.confirmClear = true; render(true); } });
  inner.append(h('div', { class: 'dtot' }, h('b', { id: 'tot', text: won(sumRows(S.rows)) }),
    h('div', { class: 'acts' }, clear, h('button', { type: 'button', text: S.pad ? '키패드 닫기' : '금액 추가', onclick: () => { S.pad = !S.pad; S.confirmClear = false; render(true); } }))));
  return inner;
}

render(true);
try { if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
})();
</script>
</body>
